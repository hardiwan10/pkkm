<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PKKM MAN 1 Soppeng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Cek apakah sudah login
        const loggedUser = JSON.parse(localStorage.getItem('user'));
        if (loggedUser) {
            if (loggedUser.role === 'admin' || loggedUser.role === 'penilai') {
                window.location.href = 'admin';
            } else {
                window.location.href = 'dashboard';
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

        body,
        input,
        select,
        textarea,
        button,
        p,
        span,
        div {
            font-family: 'Open Sans', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .brand-font {
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>

<body
    class="bg-slate-900 min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(16,185,129,0.25),rgba(255,255,255,0))] selection:bg-emerald-500 selection:text-white">

    <div
        class="bg-white/95 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100 relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-emerald-600 via-teal-500 to-cyan-600"></div>

        <div class="text-center mb-8">
            <img src="assets/img/logo manesa.png" alt="Logo MAN 1 Soppeng" class="w-20 h-20 mx-auto mb-4 object-contain drop-shadow-lg hover:scale-105 transition-transform">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">PKKM MANESA</h1>
            <p class="text-xs sm:text-sm font-semibold text-slate-500 mt-1 uppercase tracking-wider">Penilaian Kinerja
                Kepala Madrasah</p>
            <p class="text-[11px] text-slate-400">MAN 1 Soppeng</p>
        </div>

        <!-- Login Form -->
        <div id="loginSection">
            <form id="loginForm" class="space-y-4">
                <div>
                    <label
                        class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fas fa-user text-sm"></i>
                        </span>
                        <input type="text" id="loginUser" required
                            class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition text-sm outline-none font-medium text-slate-800"
                            placeholder="Username Anda">
                    </div>
                </div>
                <div>
                    <label
                        class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fas fa-lock text-sm"></i>
                        </span>
                        <input type="password" id="loginPass" required
                            class="block w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition text-sm outline-none font-medium text-slate-800"
                            placeholder="••••••••">
                    </div>
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 rounded-xl transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 shadow-lg shadow-emerald-600/20 text-sm tracking-wide mt-2">
                    MASUK SISTEM
                </button>
            </form>
            <!-- <p class="text-center mt-6 text-xs font-medium text-slate-500">
                Belum punya akun tim? <a href="#" onclick="toggleAuth(false)" class="text-emerald-600 font-bold hover:underline">Daftar di sini</a>
            </p> -->
        </div>

        <!-- Register Form -->
        <div id="registerSection" class="hidden">
            <form id="registerForm" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nama
                        Lengkap</label>
                    <input type="text" id="regName" required
                        class="block w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition text-sm outline-none font-medium"
                        placeholder="Nama Lengkap dengan Gelar">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Username</label>
                    <input type="text" id="regUser" required
                        class="block w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition text-sm outline-none font-medium"
                        placeholder="Pilih Username">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="regPass" required
                        class="block w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition text-sm outline-none font-medium"
                        placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Peran /
                        Role</label>
                    <select id="regRole"
                        class="block w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 transition text-sm outline-none font-medium text-slate-700">
                        <option value="user">User (Tim Penyusun Bukti Fisik)</option>
                        <option value="admin">Admin (Administrator PKKM)</option>
                        <option value="penilai">Penilai (Tim Asesor PKKM - Hanya Lihat)</option>
                    </select>
                </div>
                <button type="submit"
                    class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-600/20 text-sm mt-2">
                    DAFTAR AKUN TIM
                </button>
            </form>
            <p class="text-center mt-5 text-xs font-medium text-slate-500">
                Sudah punya akun? <a href="#" onclick="toggleAuth(true)"
                    class="text-emerald-600 font-bold hover:underline">Masuk di sini</a>
            </p>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <a href="index"
                class="text-xs text-slate-400 hover:text-emerald-600 font-semibold transition inline-flex items-center">
                <i class="fas fa-arrow-left mr-1.5 text-[10px]"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        function toggleAuth(isLogin) {
            const loginSec = document.getElementById('loginSection');
            const regSec = document.getElementById('registerSection');
            const title = document.querySelector('title');

            if (isLogin) {
                loginSec.classList.remove('hidden');
                regSec.classList.add('hidden');
                title.innerText = "Login - PKKM MAN 1 Soppeng";
            } else {
                loginSec.classList.add('hidden');
                regSec.classList.remove('hidden');
                title.innerText = "Daftar Akun - PKKM MAN 1 Soppeng";
            }
        }
    </script>
</body>

</html>
